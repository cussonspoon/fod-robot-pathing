[project]
name = "fod-robot-pathing"
version = "0.2.2"
description = "Navigation, path planning and motion control for the FOD robot."
readme = "README.md"
requires-python = ">=3.11,<3.13"

# Dependency baseline is fixed by CLAUDE.md section 2: two CPU cores and a
# Raspberry Pi. Ask before adding to this list.
#   opencv-python-headless, not opencv-python -- the only runtime OpenCV call is
#   findHomography and the GUI build drags in X11 for nothing.
#   paho-mqtt is gone: the vision side turned out to be a library, not a topic.
#
# Python 3.11, not 3.12. The vision package must load apt's picamera2 and
# hailo_platform, which are built against the Pi's system 3.11, so the venv it
# runs in has to be 3.11 with --system-site-packages. Nothing in this package
# ever needed 3.12; the old pin was arbitrary.
#
# fod-vision itself is NOT declared here. It is installed into the Pi's system
# interpreter from Bthcorn's release, it only exists on hardware, and
# link/vision.py imports it lazily so this package stays importable on a laptop.
#
# The floors are the Pi's apt versions, not the newest: nav imports into the
# same process as picamera2 and hailo_platform, which run on apt numpy 1.24 and
# python3-opencv 4.6. The whole suite passes on exactly those.
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.6",
]

[project.scripts]
fodnav-sim = "fodnav.cli.sim:main"
fodnav-teleop = "fodnav.cli.teleop:main"
fodnav-calib-ground = "fodnav.cli.calib_ground:main"
fodnav-replay = "fodnav.cli.replay:main"
fodnav-run = "fodnav.cli.run:main"

[dependency-groups]
# matplotlib is for sim plots only. It must never be imported by runtime code.
dev = [
    "pytest>=8.0",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fodnav"]

# Ship config/ inside the wheel, so an installed fodnav-sim works from any
# directory. find_config_dir() uses this copy only when there is no config/
# beside the caller; a real robot still passes its own with --config-dir.
[tool.hatch.build.targets.wheel.force-include]
"config" = "fodnav/_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
