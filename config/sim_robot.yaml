# sim_robot.yaml -- A ROBOT THAT DOES NOT EXIST.
#
# ===========================================================================
#  NOTHING IN THIS FILE IS A MEASUREMENT OF ANYTHING.
#  Every number is invented. It describes a plausible small differential-drive
#  robot so that the nav stack runs end to end on a laptop with no camera, no
#  Pi and no chassis. It is never loaded by a run that talks to hardware.
#
#  Do not copy a value out of here into config/robot.yaml. Ever. If you find
#  yourself tempted, the number you want is in docs/HARDWARE.md as a
#  measurement procedure, and Teemy takes it.
# ===========================================================================
#
# Schema-identical to config/robot.yaml on purpose: same keys, same loader,
# same validation, so swapping one for the other is a single flag and the
# simulated path exercises exactly the code the real path does.

drive:
  wheel_radius_m: 0.0325      # 65 mm wheel
  track_width_m: 0.2000
  ticks_per_rev: 1440.0       # 12 CPR x 30:1 gearbox x4 quadrature
  quadrature: 4
  v_max_mps: 0.45
  v_min_mps: 0.03
  omega_max_radps: 3.0
  omega_min_radps: 0.15
  stopping_distance_m: 0.06

camera:
  # Mount geometry is still undecided (PRD O-3; RESULT.md narrows it to 10-25 deg
  # at 15-30 cm and no further). These are a plausible pick inside that band --
  # low and steeply tilted, because with the real 66 deg lens a higher, flatter
  # mount pushes the near limit out fast. At 0.22 m and 18 deg, which is what
  # this file said while the camera was imaginary, the blind leg would be 0.44 m.
  height_m: 0.180
  tilt_deg: 25.0
  offset_x_m: 0.050
  offset_y_m: 0.0
  roll_deg: 0.0
  capture_width_px: 1280      # his default; the frame his boxes are measured in
  capture_height_px: 720
  # Derived from the optics in src/fodnav/sim/camera.py, not chosen separately.
  # tests/test_sim_camera.py pins them. Note the detection swath is now only
  # ~1.8x the drum width, not ~3x as the 102 deg fiction implied.
  fov_near_limit_m: 0.2297    # bottom image row. Blind leg = this minus drum.offset_x_m
  fov_far_limit_m: 1.600      # detector-limited, not geometry-limited
  fov_width_at_lookahead_m: 0.3931  # frame width on the floor at 0.3 m
drum:
  width_m: 0.220
  capture_width_m: 0.180
  offset_x_m: -0.060          # behind the axle, hence the blind leg
  clearance_mm: 12.0

obstacle:
  tof_height_m: 0.100
  tof_offset_x_m: 0.140
  tof_threshold_m: 0.250

chassis:
  mass_kg: 4.5
  footprint_length_m: 0.320
  footprint_width_m: 0.260
  planner_margin_m: 0.200

power:
  nominal_v: 11.1
  warn_v: 10.2
  cutoff_v: 9.6

link:
  port: sim://no-serial-port  # there is no port; the sim transport ignores this
  baud: 115200
  proto_version: 1
